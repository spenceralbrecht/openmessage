# OpenMessage as a headless server with persistent storage.
#
# Usage:
#     docker compose up -d
#     docker compose exec openmessage openmessage pair    # one-time
#     # then connect clients to http://localhost:7007/mcp/sse with OPENMESSAGES_AUTH_TOKEN

services:
  openmessage:
    build: .
    image: openmessage:latest
    container_name: openmessage
    restart: unless-stopped
    ports:
      - "127.0.0.1:7007:7007"
    volumes:
      - openmessage-data:/data
    environment:
      OPENMESSAGES_DATA_DIR: /data
      OPENMESSAGES_HOST: 0.0.0.0
      OPENMESSAGES_UNSAFE_NETWORK: "1"
      OPENMESSAGES_AUTH_TOKEN: ${OPENMESSAGES_AUTH_TOKEN:?Set OPENMESSAGES_AUTH_TOKEN to a random 32-byte hex value before starting compose}
      OPENMESSAGES_PORT: "7007"
      # Set to "1" to send anonymous heartbeats (off by default).
      # OPENMESSAGE_TELEMETRY_ENABLED: "0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header=\"X-OpenMessage-Token: $$OPENMESSAGES_AUTH_TOKEN\" http://localhost:7007/api/status >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  openmessage-data:
